[defaults]
inventory = inventory/hosts
host_key_checking = False
retry_files_enabled = False
# k3s applies each AddOn as soon as it is copied, so the master (a Pi 4 on an SD
# card) gets busy pulling images and running Helm installs while the playbook is
# still going: give SSH and the sudo prompt more than the default 10s.
timeout = 60

[ssh_connection]
# Run modules through the SSH session instead of copying them to a temp file first:
# fewer round trips per task (Raspberry Pi OS sudoers has no `requiretty`).
pipelining = True
# Reuse one SSH connection per host across tasks
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
