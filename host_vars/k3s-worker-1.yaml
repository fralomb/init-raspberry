---
# Raspberry Pi 5 (8 GB) with a USB SSD. The local AI models (apps/ai) are disabled.
ssd_storage: true

# Applied by the last play in playbook.yaml.
# The label attracts: Ollama's nodeSelector and the SSD PersistentVolume select it.
k3s_node_labels:
  homelab/ai: "true"
# Disabled, together with the taint tasks in playbook.yaml: the node is free for other
# workloads. The taint repels: only pods tolerating it (Ollama) are scheduled here.
# k3s_node_taints:
#   - homelab/ai=true:NoSchedule
