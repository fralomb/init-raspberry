---
# External Secrets Operator: syncs secrets from OpenBao into Kubernetes Secrets.
# If OpenBao is sealed the synced Secrets are kept, only refreshes fail.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: external-secrets
  namespace: kube-system
spec:
  repo: https://charts.external-secrets.io
  chart: external-secrets
  targetNamespace: external-secrets
  createNamespace: true
  version: 2.11.0
  valuesContent: |-
    installCRDs: true
