---
# Cluster-wide store backed by the OpenBao KV v2 engine mounted at secret/.
# ESO logs in with its own ServiceAccount through OpenBao's Kubernetes auth
# (role external-secrets, set up by openbao.yaml): no token to store.
# Needs the external-secrets.io CRDs: k3s retries it until the chart installs them.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
