---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    tlsStore:
      default:
        certificates:
        - secretName: francesco-lombardo-it-tls
        defaultCertificate:
          secretName: francesco-lombardo-it-tls
    logs:
      general:
        level: DEBUG
      access:
        enabled: true
        filters:
          statuscodes: "200,300-302"
          retryattempts: true
          minduration: 10ms

    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      traefik:
        expose:
          default: true
    # Create an IngressRoute for the dashboard
    ingressRoute:
      dashboard:
        enabled: true
        # Custom match rule with host domain
        matchRule: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
        entryPoints: ["traefik"]
    extraObjects:
    - apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: redirect-non-www-to-www
      spec:
        redirectRegex:
          permanent: true
          regex: "^(https?)://(?:www\\.)?(.+)$"
          replacement: "${1}://www.${2}"
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
