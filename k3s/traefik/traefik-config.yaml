---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # ServiceLB (klipper-lb) runs one svclb-traefik pod per node to expose 80/443 on
    # every node IP. k3s adds this annotation's tolerations to that DaemonSet, so it
    # also runs on the Pi 5 despite its homelab/ai taint (host_vars/k3s-worker-1.yaml).
    service:
      annotations:
        svccontroller.k3s.cattle.io/tolerations: |
          [{"key": "homelab/ai", "operator": "Exists", "effect": "NoSchedule"}]
    tlsStore:
      default:
        certificates:
        - secretName: francesco-lombardo-it-tls
        defaultCertificate:
          secretName: francesco-lombardo-it-tls
    logs:
      general:
        level: INFO
      access:
        enabled: true
        filters:
          statuscodes: "200,300-302"
          retryattempts: true
          minduration: 10ms

    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    # No dashboard: the chart then creates no dashboard IngressRoute, and the
    # traefik entrypoint (8080, health checks) stays unexposed as by default.
    api:
      dashboard: false
    extraObjects:
    - apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: redirect-non-www-to-www
      spec:
        redirectRegex:
          permanent: true
          regex: "^(https?)://(?:www\\.)?(.+)$"
          replacement: "${1}://www.${2}"
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
