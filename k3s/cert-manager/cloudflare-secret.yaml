---
# Cloudflare API token for the DNS-01 solver, from OpenBao secret/cloudflare.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare
        property: api-token
