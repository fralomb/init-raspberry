---
# Cloudflare API Token Secret
# This secret is required for DNS01 challenge with Cloudflare
#
# To create the API token in Cloudflare:
# 1. Go to Cloudflare Dashboard -> My Profile -> API Tokens
# 2. Create Token -> Use template "Edit zone DNS"
# 3. Zone Resources: Include -> Specific zone -> your domain
# 4. Copy the generated token
#
# Create this secret manually with:
#   kubectl create secret generic cloudflare-api-token \
#     --from-literal=api-token=YOUR_CLOUDFLARE_API_TOKEN \
#     -n cert-manager
#
# Or apply this file after updating the token:

apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "YOUR_CLOUDFLARE_API_TOKEN"  # TODO: Replace with actual token
