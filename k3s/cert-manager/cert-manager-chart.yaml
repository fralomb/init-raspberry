---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  repo: https://charts.jetstack.io
  chart: cert-manager
  targetNamespace: cert-manager
  createNamespace: true
  version: v1.21.2
  valuesContent: |-
    # Check the DNS-01 TXT record against public resolvers, not the LAN/cluster DNS
    dns01RecursiveNameservers: "8.8.8.8:53,1.1.1.1:53"
    dns01RecursiveNameserversOnly: true
    crds:
      enabled: true
      keep: true
    prometheus:
      enabled: false

