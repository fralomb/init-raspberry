---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  targetNamespace: gitops
  createNamespace: true
  version: 6.7.18
  valuesContent: |-
    global:
      domain: argocd.homelab.francesco-lombardo.it
      logging:
        format: json
        level: info
    configs:
      params:
        # TLS is terminated by Traefik
        server.insecure: true
      # Repository credentials are not set here (they would be committed): the
      # GitHub App Secret is created by hand in the gitops namespace, see README.
    # Shipped with the release rather than as a separate manifest, so it is only
    # applied once the gitops namespace exists.
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: argocd-server
          namespace: gitops
        spec:
          entryPoints:
            - websecure
          routes:
            - kind: Rule
              match: Host(`argocd.homelab.francesco-lombardo.it`)
              priority: 10
              services:
                - name: argocd-server
                  port: 80
            # argocd CLI (gRPC) without --grpc-web
            - kind: Rule
              match: Host(`argocd.homelab.francesco-lombardo.it`) && Header(`Content-Type`, `application/grpc`)
              priority: 11
              services:
                - name: argocd-server
                  port: 80
                  scheme: h2c
          # Served by the default TLSStore certificate (see k3s/traefik/traefik-config.yaml)
          tls: {}
