---
# ArgoCD Helm Chart
# GitOps continuous delivery tool for Kubernetes
# Docs: https://argo-cd.readthedocs.io/

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  targetNamespace: gitops
  createNamespace: true
  version: 6.7.18
  valuesContent: |-
    # Global settings
    global:
      domain: argocd.example.com  # TODO: Update with your domain
      logging:
        format: json
        level: info

    # Server configuration
    configs:
      params:
        # Run in insecure mode (TLS termination at Gateway)
        server.insecure: true

    # Resource limits for Raspberry Pi
    controller:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    server:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    repoServer:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    redis:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    dex:
      enabled: false  # Disable Dex for simpler setup

    applicationSet:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    notifications:
      enabled: false  # Disable notifications for simpler setup
