---
# Argo CD credentials for this repo (GitHub App), from OpenBao
# secret/argocd/repo-init-raspberry: githubAppID (numeric App ID, not the Client ID),
# githubAppInstallationID, githubAppPrivateKey.
# Needs the gitops namespace: k3s retries it until the argocd chart creates it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-init-raspberry
  namespace: gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: repo-init-raspberry
    template:
      engineVersion: v2
      # Keep the extracted keys and add the fixed ones below
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/fralomb/init-raspberry
  dataFrom:
    - extract:
        key: argocd/repo-init-raspberry
