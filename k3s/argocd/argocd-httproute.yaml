---
# ArgoCD HTTPRoute for Gateway API
# Routes traffic from the main Gateway to ArgoCD server

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: gitops
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-infra
      sectionName: https
  hostnames:
    - "argocd.example.com"  # TODO: Update with your ArgoCD domain
  rules:
    # Route all traffic to ArgoCD server
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80

---
# ArgoCD gRPC route for CLI access
# ArgoCD CLI uses gRPC protocol
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-grpc-route
  namespace: gitops
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-infra
      sectionName: https
  hostnames:
    - "argocd.example.com"  # TODO: Update with your ArgoCD domain
  rules:
    # Route gRPC traffic (content-type: application/grpc)
    - matches:
        - headers:
            - name: content-type
              value: application/grpc
      backendRefs:
        - name: argocd-server
          port: 80

---
# ReferenceGrant to allow HTTPRoute from gitops namespace
# to reference Gateway in gateway-infra namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gitops-routes
  namespace: gateway-infra
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: gitops
  to:
    - group: ""
      kind: Service
