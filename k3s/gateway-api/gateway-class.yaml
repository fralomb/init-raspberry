---
# GatewayClass defines the controller that manages Gateways
# This is the cluster-scoped resource that references the Istio controller

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio
spec:
  controllerName: istio.io/gateway-controller
  description: "Istio Gateway controller for Raspberry Pi K3s cluster"
