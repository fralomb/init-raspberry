---
# GatewayClass defines the controller that manages Gateways
# This is the cluster-scoped resource that references the Envoy Gateway controller

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  description: "Envoy Gateway controller for Raspberry Pi K3s cluster"
