---
# Istio Base - CRDs and cluster-wide resources
# This must be installed before istiod
# Docs: https://istio.io/latest/docs/setup/install/helm/

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: istio-base
  namespace: kube-system
spec:
  repo: https://istio-release.storage.googleapis.com/charts
  chart: base
  targetNamespace: istio-system
  createNamespace: true
  version: 1.22.0
  valuesContent: |-
    # Enable Gateway API CRD management
    # Istio will manage its own Gateway API integration
    defaultRevision: default

---
# Istiod - Istio Control Plane
# Core component that manages service mesh configuration

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: istiod
  namespace: kube-system
spec:
  repo: https://istio-release.storage.googleapis.com/charts
  chart: istiod
  targetNamespace: istio-system
  createNamespace: true
  version: 1.22.0
  valuesContent: |-
    # Minimal profile for Raspberry Pi
    pilot:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Enable Gateway API support
      env:
        PILOT_ENABLE_GATEWAY_API: "true"
        PILOT_ENABLE_GATEWAY_API_STATUS: "true"
        PILOT_ENABLE_GATEWAY_API_DEPLOYMENT_CONTROLLER: "true"

    # Global settings
    global:
      # Use distroless images for security
      variant: distroless
      # Logging configuration
      logging:
        level: "default:info"
      # Proxy settings for ARM
      proxy:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

    # Disable telemetry for lighter footprint
    meshConfig:
      enablePrometheusMerge: false
      accessLogFile: /dev/stdout
      accessLogEncoding: JSON

---
# Istio Ingress Gateway
# Handles incoming traffic to the cluster

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: istio-ingress
  namespace: kube-system
spec:
  repo: https://istio-release.storage.googleapis.com/charts
  chart: gateway
  targetNamespace: istio-ingress
  createNamespace: true
  version: 1.22.0
  valuesContent: |-
    # Gateway name
    name: istio-ingressgateway

    # Resource limits for Raspberry Pi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Replica count (1 for single node, increase for HA)
    replicaCount: 1

    # Service configuration
    service:
      type: LoadBalancer
      ports:
        - name: http
          port: 80
          targetPort: 80
          protocol: TCP
        - name: https
          port: 443
          targetPort: 443
          protocol: TCP

    # Autoscaling disabled for Raspberry Pi
    autoscaling:
      enabled: false

    # Pod disruption budget
    podDisruptionBudget:
      minAvailable: 0
