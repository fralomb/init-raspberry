---
# learn-chess: the app's own repo owns its Kubernetes manifests (fralomb/learn-chess, infra/k8s:
# Deployment, Service, IngressRoute and the ghcr pull secret). This Application only syncs them.
# - Web: https://learn-chess.homelab.francesco-lombardo.it through Traefik.
# - The repo is private: Argo CD reads it with the repository Secret below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learn-chess
  namespace: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/fralomb/learn-chess
    targetRevision: master
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: learn-chess
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Argo CD credentials for fralomb/learn-chess: the same GitHub App as init-raspberry
# (OpenBao secret/argocd/repo-init-raspberry), installed on every repo of the account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-learn-chess
  namespace: gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: repo-learn-chess
    template:
      engineVersion: v2
      # Keep the extracted keys and add the fixed ones below
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/fralomb/learn-chess
  dataFrom:
    - extract:
        key: argocd/repo-init-raspberry
