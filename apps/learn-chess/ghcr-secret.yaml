---
# Pull secret for the private ghcr.io/fralomb/learn-chess image, from OpenBao
# secret/gh (key `read-packages-token`: a GitHub token with read:packages).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr
  namespace: learn-chess
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ghcr
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"fralomb","password":"{{ .token }}","auth":"{{ printf "fralomb:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: gh
        property: read-packages-token
