---
# OAuth client of the Tailscale operator, from OpenBao secret/tailscale/operator-oauth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: operator-oauth
  dataFrom:
    # client_id, client_secret
    - extract:
        key: tailscale/operator-oauth
