---
# Kernel parameters required by k3s on Raspberry Pi
cgroup_options: "cgroup_memory=1 cgroup_enable=memory cgroup_enable=cpuset"

common_packages:
  - curl
  # dig/nslookup, to troubleshoot DNS
  - bind9-dnsutils

# DNS servers for the node, instead of the ones announced by DHCP (the home router,
# whose resolver drops queries under bursts such as image pulls: "lookup ...: Try again").
# containerd pulls images through the node's resolver. Empty list: keep the DHCP DNS.
common_dns_servers:
  - 1.1.1.1
  - 8.8.8.8
