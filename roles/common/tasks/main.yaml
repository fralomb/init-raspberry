---

- name: Ensure base packages are installed
  apt:
    pkg: "{{ common_packages }}"
    state: present
    update_cache: yes

- name: Check if /boot/firmware/cmdline.txt exists (Bookworm and later)
  stat:
    path: /boot/firmware/cmdline.txt
  register: cmdline_firmware

- name: Set cmdline.txt path
  set_fact:
    cmdline_path: "{{ '/boot/firmware/cmdline.txt' if cmdline_firmware.stat.exists else '/boot/cmdline.txt' }}"

- name: Enable cgroups in cmdline.txt
  replace:
    path: "{{ cmdline_path }}"
    regexp: '^(?!.*\bcgroup_enable=memory\b)(.+)$'
    replace: '\1 {{ cgroup_options }}'
  notify:
    - Reboot

- name: Check if dphys-swapfile is installed
  stat:
    path: /sbin/dphys-swapfile
  register: dphys_swapfile

- name: Disable swap
  when: disable_swap and dphys_swapfile.stat.exists
  block:
    - name: Stop and disable swap service
      service:
        name: dphys-swapfile
        state: stopped
        enabled: false

    - name: Turn off active swap
      command: dphys-swapfile swapoff
      when: ansible_memory_mb.swap.total | default(0) > 0
