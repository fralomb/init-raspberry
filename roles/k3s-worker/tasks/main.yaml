---
# Main task file for k3s-worker role
# Installs and configures K3s worker (agent) node

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Check if K3s agent service is running
  ansible.builtin.systemd:
    name: k3s-agent
  register: k3s_agent_service
  failed_when: false

- name: Get master node information
  ansible.builtin.set_fact:
    k3s_master_host: "{{ hostvars[groups['k3s_master'][0]]['ansible_default_ipv4']['address'] | default(hostvars[groups['k3s_master'][0]]['ansible_host']) }}"
    k3s_master_token: "{{ hostvars[groups['k3s_master'][0]]['k3s_token'] }}"
  when: groups['k3s_master'] | length > 0

- name: Display connection information
  ansible.builtin.debug:
    msg: "Connecting to K3s master at {{ k3s_master_host }} with token {{ k3s_master_token[:20] }}..."

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: not k3s_binary.stat.exists

- name: Install K3s worker node
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ k3s_master_host }}:6443"
    K3S_TOKEN: "{{ k3s_master_token }}"
    INSTALL_K3S_EXEC: "agent {{ k3s_worker_extra_args }}"
  become: yes
  when: not k3s_binary.stat.exists
  register: k3s_install

- name: Wait for K3s agent to start
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: yes
  become: yes

- name: Clean up installation script
  ansible.builtin.file:
    path: /tmp/k3s-install.sh
    state: absent

- name: Verify worker node joined the cluster
  ansible.builtin.debug:
    msg: |
      K3s worker node installation complete!
      This node should now be visible in the cluster.
      Run 'kubectl get nodes' on the master node to verify.
