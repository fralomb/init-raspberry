---

- name: Set master node facts
  set_fact:
    k3s_master: "{{ groups['master'][0] }}"

- name: Set k3s server URL and token
  set_fact:
    k3s_url: "https://{{ hostvars[k3s_master].ansible_host | default(hostvars[k3s_master].ansible_default_ipv4.address) }}:6443"
    k3s_token: "{{ hostvars[k3s_master].k3s_node_token }}"

- name: Download k3s install script
  get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: 0755

- name: Install k3s agent
  command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "agent {{ k3s_agent_args }}"
    K3S_URL: "{{ k3s_url }}"
    K3S_TOKEN: "{{ k3s_token }}"
  args:
    creates: /usr/local/bin/k3s

- name: Ensure k3s-agent service is started and enabled at boot
  service:
    name: k3s-agent
    state: started
    enabled: true
