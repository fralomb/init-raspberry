---
k3s_channel: stable
k3s_version: ""

# Extra arguments passed to the k3s server
k3s_server_args: "--write-kubeconfig-mode 644"

# Manifests (paths relative to the playbook directory) installed through the k3s
# auto-deploying AddOns: k3s applies every file in k3s_manifests_dir on start and
# whenever it changes.
k3s_manifests_dir: /var/lib/rancher/k3s/server/manifests
# Files land flat in that directory, so basenames must be unique and must not
# clash with the k3s packaged components (traefik.yaml, coredns.yaml, ...).
# k3s tracks each file with an Addon object named after the basename, so it must be
# a valid Kubernetes name (lowercase letters, digits, '-'): a file named
# foo_bar.yaml is silently never applied.
k3s_addons:
  - k3s/traefik/traefik-config.yaml
  - k3s/cert-manager/cert-manager-chart.yaml
  # Needs the cert-manager CRDs: k3s retries it until the chart above installs them.
  - k3s/cert-manager/cloudflare-issuer.yaml
  - k3s/argocd/argocd-chart.yaml
  # Needs the argoproj.io CRDs: k3s retries it until the chart above installs them.
  - k3s/argocd/argocd-apps.yaml
  - k3s/tailscale/tailscale-operator-chart.yaml
  # Needs the tailscale.com CRDs: k3s retries it until the operator chart installs them.
  - k3s/tailscale/subnet-router.yaml

# Copy /etc/rancher/k3s/k3s.yaml to the control machine after install.
# Kept outside the repo: it holds cluster-admin client cert and key.
k3s_fetch_kubeconfig: true
k3s_kubeconfig_dest: "{{ lookup('env', 'HOME') }}/.kube/config-raspberry"

# k3s names the cluster, user and context all "default", which collides when this
# kubeconfig is merged with others.
k3s_context_name: localk3s
