---

- name: Check if k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download k3s install script
  get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: 0755
  when: not k3s_binary.stat.exists
  register: k3s_script
  until: k3s_script is succeeded
  retries: 5
  delay: 10

- name: Install k3s server
  command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server {{ k3s_server_args }}"
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists
  register: k3s_install
  until: k3s_install is succeeded
  retries: 3
  delay: 10

- name: Ensure k3s service is started and enabled at boot
  service:
    name: k3s
    state: started
    enabled: true

- name: Check AddOns file names are valid Kubernetes object names
  assert:
    that: (item | basename).split('.')[0] is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    fail_msg: "k3s would never apply {{ item }}: its Addon name must use only lowercase letters, digits and '-'"
    quiet: true
  loop: "{{ k3s_addons }}"

- name: Install auto-deploying AddOns manifests
  copy:
    src: "{{ playbook_dir }}/{{ item }}"
    dest: "{{ k3s_manifests_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: 0600
  loop: "{{ k3s_addons }}"

- name: Wait for node token to be generated
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

- name: Read node token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_file

- name: Store node token as fact for the agents
  set_fact:
    k3s_node_token: "{{ k3s_node_token_file.content | b64decode | trim }}"

- name: Fetch kubeconfig to the control machine
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_kubeconfig_dest }}"
    flat: yes
  when: k3s_fetch_kubeconfig

- name: Point kubeconfig at the master and restrict its permissions
  replace:
    path: "{{ k3s_kubeconfig_dest }}"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ hostvars[inventory_hostname].ansible_host | default(hostvars[inventory_hostname].ansible_facts['default_ipv4']['address']) }}:6443"
    mode: '0600'
  delegate_to: localhost
  become: false
  when: k3s_fetch_kubeconfig

- name: Name the kubeconfig cluster, user and context
  replace:
    path: "{{ k3s_kubeconfig_dest }}"
    regexp: '^(\s*-?\s*(?:name|cluster|user|current-context)): default$'
    replace: '\1: {{ k3s_context_name }}'
  delegate_to: localhost
  become: false
  when: k3s_fetch_kubeconfig
