---
# KV engine, policies and Kubernetes auth. Needs a token allowed to manage mounts,
# auth methods and policies: -e openbao_token=..., else the root token from the init
# file, else prompted for.

- name: Look for the init file
  stat:
    path: "{{ openbao_init_file }}"
  register: openbao_init_stat
  when: openbao_token is not defined

- name: Read the root token from {{ openbao_init_file }}
  set_fact:
    openbao_token: "{{ (lookup('file', openbao_init_file) | from_json).root_token }}"
  no_log: true
  when: openbao_token is not defined and openbao_init_stat.stat.exists

- name: Prompt for the root token
  when: openbao_token is not defined
  block:
    - name: Enter the root token
      pause:
        prompt: OpenBao root token
        echo: false
      register: openbao_prompted_token
      no_log: true

    - name: Use the prompted token
      set_fact:
        openbao_token: "{{ openbao_prompted_token.user_input }}"
      no_log: true

# Every API call below: token header and TLS verification
- name: Configure OpenBao
  module_defaults:
    ansible.builtin.uri:
      headers:
        X-Vault-Token: "{{ openbao_token }}"
      validate_certs: "{{ openbao_validate_certs }}"
  block:
    # KV v2 secrets engine

    - name: List the secrets engines
      uri:
        url: "{{ openbao_addr }}/v1/sys/mounts"
      register: openbao_mounts

    - name: Enable the KV v2 secrets engine at {{ openbao_kv_mount }}/
      uri:
        url: "{{ openbao_addr }}/v1/sys/mounts/{{ openbao_kv_mount }}"
        method: POST
        body_format: json
        body:
          type: kv
          options:
            version: "2"
        status_code: [200, 204]
      when: (openbao_kv_mount ~ '/') not in openbao_mounts.json.data
      changed_when: true

    # Policies

    - name: Read the policies
      uri:
        url: "{{ openbao_addr }}/v1/sys/policies/acl/{{ item.key }}"
        status_code: [200, 404]
      loop: "{{ openbao_policies | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: openbao_policies_current

    - name: Write the policies
      uri:
        url: "{{ openbao_addr }}/v1/sys/policies/acl/{{ item.item.key }}"
        method: PUT
        body_format: json
        body:
          policy: "{{ item.item.value }}"
        status_code: [200, 204]
      loop: "{{ openbao_policies_current.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.status == 404 or item.json.data.policy != item.item.value
      changed_when: true

    # Kubernetes auth method

    - name: List the auth methods
      uri:
        url: "{{ openbao_addr }}/v1/sys/auth"
      register: openbao_auth

    - name: Enable the Kubernetes auth method
      uri:
        url: "{{ openbao_addr }}/v1/sys/auth/kubernetes"
        method: POST
        body_format: json
        body:
          type: kubernetes
        status_code: [200, 204]
      when: "'kubernetes/' not in openbao_auth.json.data"
      changed_when: true

    - name: Read the Kubernetes auth configuration
      uri:
        url: "{{ openbao_addr }}/v1/auth/kubernetes/config"
        status_code: [200, 404]
      register: openbao_k8s_config

    - name: Configure the Kubernetes auth method
      uri:
        url: "{{ openbao_addr }}/v1/auth/kubernetes/config"
        method: POST
        body_format: json
        body:
          kubernetes_host: "{{ openbao_kubernetes_host }}"
        status_code: [200, 204]
      when: >-
        openbao_k8s_config.status == 404
        or openbao_k8s_config.json.data.kubernetes_host != openbao_kubernetes_host
      changed_when: true

    - name: Read the Kubernetes auth roles
      uri:
        url: "{{ openbao_addr }}/v1/auth/kubernetes/role/{{ item.key }}"
        status_code: [200, 404]
      loop: "{{ openbao_kubernetes_roles | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: openbao_roles_current

    # Written when any declared parameter differs from what OpenBao returns
    - name: Write the Kubernetes auth roles
      uri:
        url: "{{ openbao_addr }}/v1/auth/kubernetes/role/{{ item.item.key }}"
        method: POST
        body_format: json
        body: "{{ item.item.value }}"
        status_code: [200, 204]
      loop: "{{ openbao_roles_current.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: >-
        item.status == 404
        or item.json.data | dict2items
           | selectattr('key', 'in', item.item.value.keys() | list)
           | items2dict != item.item.value
      changed_when: true
