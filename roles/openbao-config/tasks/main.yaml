---
# Configures OpenBao through its HTTP API. Needs an initialised, unsealed OpenBao and
# a token allowed to manage mounts, auth methods and policies (the root token).
# Every step reads the current state first, so re-runs report no changes.

- name: Look up the OpenBao Service address
  command: >-
    k3s kubectl -n {{ openbao_namespace }} get service {{ openbao_service }}
    -o jsonpath={.spec.clusterIP}
  register: openbao_cluster_ip
  changed_when: false
  when: not openbao_addr

- name: Set the OpenBao API address
  set_fact:
    openbao_api: "{{ openbao_addr or 'http://' ~ openbao_cluster_ip.stdout ~ ':8200' }}/v1"
    openbao_headers:
      X-Vault-Token: "{{ openbao_token }}"

- name: Read the seal status
  uri:
    url: "{{ openbao_api }}/sys/seal-status"
  register: openbao_seal

- name: Check OpenBao is initialised and unsealed
  assert:
    that:
      - openbao_seal.json.initialized
      - not openbao_seal.json.sealed
    fail_msg: "OpenBao must be initialised and unsealed first (bao operator init / unseal, see README)"
    quiet: true

# KV v2 secrets engine

- name: List the secrets engines
  uri:
    url: "{{ openbao_api }}/sys/mounts"
    headers: "{{ openbao_headers }}"
  register: openbao_mounts

- name: Enable the KV v2 secrets engine at {{ openbao_kv_mount }}/
  uri:
    url: "{{ openbao_api }}/sys/mounts/{{ openbao_kv_mount }}"
    method: POST
    headers: "{{ openbao_headers }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    status_code: [200, 204]
  when: (openbao_kv_mount ~ '/') not in openbao_mounts.json.data
  changed_when: true

# Policies

- name: Read the policies
  uri:
    url: "{{ openbao_api }}/sys/policies/acl/{{ item.key }}"
    headers: "{{ openbao_headers }}"
    status_code: [200, 404]
  loop: "{{ openbao_policies | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: openbao_policies_current

- name: Write the policies
  uri:
    url: "{{ openbao_api }}/sys/policies/acl/{{ item.item.key }}"
    method: PUT
    headers: "{{ openbao_headers }}"
    body_format: json
    body:
      policy: "{{ item.item.value }}"
    status_code: [200, 204]
  loop: "{{ openbao_policies_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.status == 404 or item.json.data.policy != item.item.value
  changed_when: true

# Kubernetes auth method

- name: List the auth methods
  uri:
    url: "{{ openbao_api }}/sys/auth"
    headers: "{{ openbao_headers }}"
  register: openbao_auth

- name: Enable the Kubernetes auth method
  uri:
    url: "{{ openbao_api }}/sys/auth/kubernetes"
    method: POST
    headers: "{{ openbao_headers }}"
    body_format: json
    body:
      type: kubernetes
    status_code: [200, 204]
  when: "'kubernetes/' not in openbao_auth.json.data"
  changed_when: true

- name: Read the Kubernetes auth configuration
  uri:
    url: "{{ openbao_api }}/auth/kubernetes/config"
    headers: "{{ openbao_headers }}"
    status_code: [200, 404]
  register: openbao_k8s_config

- name: Configure the Kubernetes auth method
  uri:
    url: "{{ openbao_api }}/auth/kubernetes/config"
    method: POST
    headers: "{{ openbao_headers }}"
    body_format: json
    body:
      kubernetes_host: "{{ openbao_kubernetes_host }}"
    status_code: [200, 204]
  when: >-
    openbao_k8s_config.status == 404
    or openbao_k8s_config.json.data.kubernetes_host != openbao_kubernetes_host
  changed_when: true

- name: Read the Kubernetes auth roles
  uri:
    url: "{{ openbao_api }}/auth/kubernetes/role/{{ item.key }}"
    headers: "{{ openbao_headers }}"
    status_code: [200, 404]
  loop: "{{ openbao_kubernetes_roles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: openbao_roles_current

# Written when any declared parameter differs from what OpenBao returns
- name: Write the Kubernetes auth roles
  uri:
    url: "{{ openbao_api }}/auth/kubernetes/role/{{ item.item.key }}"
    method: POST
    headers: "{{ openbao_headers }}"
    body_format: json
    body: "{{ item.item.value }}"
    status_code: [200, 204]
  loop: "{{ openbao_roles_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: >-
    item.status == 404
    or item.json.data | dict2items
       | selectattr('key', 'in', item.item.value.keys() | list)
       | items2dict != item.item.value
  changed_when: true
